<!DOCTYPE html>
<html lang="en">

<head>

    <title>Document</title>
</head>

<body>

    (x) doctype
    (x) head element
    (x) body element

    (x) At least one list with a minimum of three items
    (x) At least three images
    () At least one link to an external source.
     -->
    <main>
        <h1>My favourite PC Game: Diablo II Resurrected</h1>

        <p>Here's a list of allclasses:</p>
        
        <ul>

</html>
