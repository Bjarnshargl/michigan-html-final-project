<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diablo II Resurrected</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>

<body>
    <!--
    (x) doctype
    (x) head element
    (x) body element
    (x) At least three semantic tags including main and h1
    (x) At least one list with a minimum of three items
    (x) At least three images
    (x) At least one link to an external source.
     -->
    <main>
        <h1>My favourite PC Game: Diablo II Resurrected</h1>

        <p>Here's a list of all classes:</p>

        <ul>
            <li>Amazon</li>
            <li>Assassin</li>
            <li>Barbarian</li>
            <li>Druid</li>
            <li>Necromancer</li>
            <li>Paladin</li>
            <li>Sorceress</li>
            <li>Warlock</li>
        </ul>

        <table>
            <tr>
                <th>Amazon</th>
                <th>Assassin</th>
                <th>Barbarian</th>
                <th>Druid</th>
                <th>Necromancer</th>
                <th>Paladin</th>
                <th>Sorceress</th>
                <th>Warlock</th>
            </tr>
            <tr>
                <td><img src="images/amazon.png" alt="Amazon" style="width:150px"></td>
                <td><img src="images/assassin.png" alt="Assassin" style="width:150px"></td>
                <td><img src="images/barbarian.png" alt="Barbarian" style="width:150px"></td>
                <td><img src="images/druid.png" alt="Druid" style="width:150px"></td>
                <td><img src="images/necromancer.png" alt="Necromancer" style="width:150px"></td>
                <td><img src="images/paladin.png" alt="Paladin" style="width:150px"></td>
                <td><img src="images/sorceress.png" alt="Sorceress" style="width:150px"></td>
                <td><img src="images/warlock.png" alt="Warlock" style="width:150px"></td>
            </tr>

        </table>
    </main>
    <footer>
        <p><a href="https://diablo2.com" target="_blank">Visit the official Diablo II Resurrected website</a></p>
    </footer>
</body>
</html>
